data:
  train_manifest: data/manifests/train_with_pseudo.jsonl
  val_manifest: data/manifests/val.jsonl
  vocab_path: data/manifests/vocab.json
  use_specaugment: true

model:
  hidden_dim: 512
  freeze_backbone: false
  use_transfer: true

train:
  epochs: 20
  batch_size: 32
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 5.0
  unfreeze_epoch: 1
  num_workers: 4
  checkpoint_dir: checkpoints/semi_supervised_round1
