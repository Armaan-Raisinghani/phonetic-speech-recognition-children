data:
  train_manifest: data/manifests/train_with_pseudo.jsonl
  val_manifest: data/manifests/val.jsonl
  vocab_path: data/manifests/vocab.json
  use_specaugment: true

model:
  hidden_dim: 512
  freeze_backbone: false
  use_transfer: true

decode:
  strategy: beam
  beam_size: 8

train:
  epochs: 10
  batch_size: 8
  eval_batch_size: 8
  grad_accum_steps: 8
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 5.0
  unfreeze_epoch: null
  num_workers: 4
  selection_metric: cer
  checkpoint_dir: checkpoints/semi_supervised_round1
