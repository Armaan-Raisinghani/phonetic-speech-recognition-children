data:
  train_manifest: data/manifests/train.jsonl
  val_manifest: data/manifests/val.jsonl
  vocab_path: data/manifests/vocab.json
  use_specaugment: true

model:
  hidden_dim: 512
  freeze_backbone: true
  use_transfer: true

train:
  epochs: 30
  batch_size: 8
  eval_batch_size: 8
  grad_accum_steps: 4
  lr: 0.0005
  weight_decay: 0.0001
  grad_clip: 5.0
  unfreeze_epoch: null
  num_workers: 4
  checkpoint_dir: checkpoints/baseline
